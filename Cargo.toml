[package]
name = "wp-conf-base"
version = "0.3.0" # @gxl:set(version)
edition = "2024"
license = "Elastic-2.0"
description = "Common configuration primitives, adapters, and validators shared by WarpParse connectors."
authors = ["WarpParse Dev Team"]
readme = "README.md"
repository = "https://github.com/wp-labs/-wp-conf-base"
homepage = "https://github.com/wp-labs/-wp-conf-base"
documentation = "https://docs.rs/wp-conf-base"
keywords = ["config", "connector", "warp", "orion", "wp"]
categories = ["config"]

[lib]
name = "wp_conf_base"

[dependencies]
wp-model-core = "0.8"
wp-connector-api = "0.9"
log = "0.4"
toml = "1.0"
orion-error = "0.7"
orion-variate= "0.12"
orion_conf =  { version = "0.6", features = ["toml"]}
winnow = "1.0"
derive_more = "2.1"

serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"

[dev-dependencies]
serde_json = "1.0"
toml = "1.0"
